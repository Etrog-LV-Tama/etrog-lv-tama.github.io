<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תורנות ניקיון · חד״ס תמ״א</title>
<meta name="description" content="האחראי היום ולוח התורנויות של חד״ס תמ״א. סבב אחד, ראשון עד חמישי.">
<meta name="theme-color" content="#f6f7fb"><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{color-scheme:light;--ink:#202739;--muted:#737c8e;--line:#e6e9f1;--blue:#4863da;--blue-light:#eef1ff;--green:#497e69;--glass:rgba(255,255,255,.85)}
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #8b9dff;outline-offset:3px}button:disabled{cursor:default;opacity:.35}button,a,summary{touch-action:manipulation}body:before{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse at 85% 0%,#e4e9ff 0,transparent 47%),radial-gradient(ellipse at 0% 40%,#e2f0ed 0,transparent 40%);pointer-events:none}main{max-width:940px;margin:auto;padding:28px max(20px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}header{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:42px;height:48px;object-fit:contain}.brand{font-size:14px;font-weight:700}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.4px}.tag{margin-right:auto;font-size:11px;color:var(--green);background:#ecf4ef;padding:6px 10px;border:1px solid #dceae2;border-radius:30px;white-space:nowrap}.intro{margin-bottom:21px}.eyebrow{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:1px;margin:0 0 5px}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1.1px;line-height:1.2;margin:0 0 9px;font-weight:750}.sub{font-size:14px;color:var(--muted);margin:0}.hero{border:1px solid rgba(255,255,255,.95);background:var(--glass);box-shadow:0 14px 48px #27345509;border-radius:26px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center;position:relative;overflow:hidden;min-height:179px}.hero:after{content:"";width:200px;height:200px;position:absolute;left:-105px;top:-95px;border-radius:50%;border:35px solid #eff2ff;pointer-events:none}.hero-main{position:relative;z-index:1}.hero-date{font-size:12px;color:var(--muted);margin-bottom:10px}.hero-label{font-size:12px;color:var(--blue);font-weight:650}.hero-name{font-size:32px;letter-spacing:-.8px;line-height:1.25;margin:5px 0 7px;font-weight:750}.hero-note{font-size:12px;color:var(--muted);margin:0}.avatar{width:74px;height:74px;border-radius:23px;display:grid;place-items:center;background:linear-gradient(140deg,#e6eaff,#eff7f3);font-size:25px;color:var(--blue);font-weight:650;flex-shrink:0;position:relative;z-index:1}.next{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 5px 22px;font-size:12px;color:var(--muted)}.next .arrow{color:var(--blue)}.next strong{color:var(--ink);font-weight:600}.board{border:1px solid #fff;background:var(--glass);border-radius:26px;padding:23px;box-shadow:0 10px 36px #27345505}.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px}.month-nav h2{font-size:19px;letter-spacing:-.4px;line-height:1.2;margin:0}.month-nav small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}.arrows{display:flex;gap:4px;margin-right:auto}.icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;display:grid;place-items:center;font-size:23px;line-height:1}.today-btn{background:transparent;border:0;color:var(--blue);font-size:12px;padding:10px;min-height:44px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.weekdays{margin-bottom:9px;text-align:center;color:var(--muted);font-size:11px}.day{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1px solid var(--line);background:#fff;min-height:98px;border-radius:14px;padding:10px;text-align:right;position:relative;min-width:0;transition:border-color .15s,background .15s}.day:hover{border-color:#aebcf5}.day[aria-pressed=true]{border-color:var(--blue);background:var(--blue-light);box-shadow:0 0 0 1px var(--blue)}.day.today .num{background:var(--blue);color:#fff}.num{font-size:12px;font-weight:650;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;margin-right:-3px}.day .name{font-size:13px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}.day.past:not([aria-pressed=true]){background:#fafbfc;color:#8991a0}.day.empty-duty .name{font-size:10px;font-weight:400;color:#9da4b1}.blank{min-height:98px}.selected{margin-top:17px;border-top:1px solid var(--line);padding-top:17px;display:flex;align-items:center;gap:12px;min-height:69px}.selected .mini{width:39px;height:39px;border-radius:13px;background:var(--blue-light);display:grid;place-items:center;color:var(--blue);font-size:14px;flex-shrink:0}.selected small{color:var(--muted);font-size:11px;display:block}.selected strong{font-size:15px;font-weight:650}.pill{font-size:10px;border-radius:20px;background:var(--blue-light);color:var(--blue);padding:4px 8px;margin-right:auto;white-space:nowrap}.legend{font-size:10px;color:var(--muted);margin:15px 2px 0}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:5px}.rotation{margin-top:19px;background:#ffffff80;border:1px solid #fff;border-radius:20px;padding:0 19px}summary{cursor:pointer;min-height:56px;display:flex;align-items:center;gap:9px;list-style:none;font-size:13px;font-weight:600}summary::-webkit-details-marker{display:none}summary .count{color:var(--muted);font-size:11px;font-weight:400}summary .chev{margin-right:auto;color:var(--muted)}details[open] .chev{transform:rotate(180deg)}.people{display:flex;flex-wrap:wrap;gap:7px;padding:0 0 15px;margin:0;list-style:none;counter-reset:person}.people li{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;counter-increment:person}.people li:before{content:counter(person);color:#9aa3b5;margin-left:7px;font-size:10px}.rotation-note{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding:12px 0 15px;margin:0}footer{color:#8991a2;font-size:10px;display:flex;gap:12px;justify-content:space-between;margin:22px 3px 0}footer span{max-width:75%}button svg{width:18px;height:18px}noscript{display:block;background:#fff;padding:20px;border-radius:15px}.error{background:#fff0f0;color:#a22;padding:15px;border-radius:14px}.loading{opacity:.4}
@media(min-width:700px){main{padding-top:38px}.intro{margin-top:38px}.hero{padding:30px;min-height:190px}.hero-name{font-size:40px}.avatar{width:88px;height:88px;font-size:30px}.board{padding:28px}.day{min-height:108px;padding:13px}.calendar,.weekdays{gap:10px}.day .name{font-size:14px}header{margin-bottom:32px}.hero-date{font-size:13px}}
@media(max-width:400px){main{padding-right:15px;padding-left:15px}.hero{padding:20px;gap:10px}.hero-name{font-size:29px}.avatar{width:58px;height:64px;border-radius:19px;font-size:22px}.board{padding:16px 12px}.day{padding:7px 5px;gap:7px;min-height:92px;border-radius:11px}.day .name{font-size:11px}.calendar,.weekdays{gap:5px}.month-nav{gap:4px}.month-nav h2{font-size:18px}.icon-btn{width:40px}.tag{font-size:10px}.blank{min-height:92px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<header><a href="/" aria-label="אתר מגמת תמ״א"><img class="logo" src="/logo.png" alt="סמל אתרוג"></a><div class="brand">מגמת תמ״א<small>קורס אתרוג ל״ו</small></div><span class="tag">ראשון עד חמישי</span></header>
<section class="intro"><p class="eyebrow">חד״ס תמ״א</p><h1>מקום נקי. ראש שקט.</h1><p class="sub">אחראי אחד בכל יום. סבב משותף לכולם.</p></section>
<section class="hero" aria-label="האחראי היום"><div class="hero-main"><div id="heroDate" class="hero-date"></div><div id="heroLabel" class="hero-label">האחראי היום</div><h2 id="heroName" class="hero-name">טוען את הסבב</h2><p id="heroNote" class="hero-note"></p></div><div id="avatar" class="avatar" aria-hidden="true">✦</div></section>
<div id="next" class="next" aria-live="polite"></div>
<section class="board" aria-label="לוח התורנויות החודשי"><div class="month-nav"><div><h2 id="monthTitle"></h2><small>לוח התורנויות</small></div><div class="arrows"><button id="prev" class="icon-btn" aria-label="החודש הקודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button><button id="current" class="today-btn">החודש</button><button id="nextMonth" class="icon-btn" aria-label="החודש הבא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button></div></div><div class="weekdays" aria-hidden="true"><span>ראשון</span><span>שני</span><span>שלישי</span><span>רביעי</span><span>חמישי</span></div><div id="calendar" class="calendar"></div><div id="selected" class="selected" aria-live="polite"></div><p class="legend"><span class="dot"></span>לחיצה על יום מציגה שם מלא · שישי ושבת מחוץ לסבב</p></section>
<details class="rotation"><summary>הסבב<span class="count" id="peopleCount"></span><span class="chev" aria-hidden="true">⌄</span></summary><ol id="people" class="people"></ol><p id="rotationNote" class="rotation-note"></p></details>
<footer><span>אותו סבב לכולם · לפי שעון ישראל</span><span>חד״ס תמ״א</span></footer>
<noscript>כדי להציג את התורנויות יש להפעיל JavaScript בדפדפן.</noscript>
</main>
<script>
'use strict';
const CONFIG={start:'2026-11-10',people:['אופק כהן','טל דוידור','עמית ביטון','רון מאיר','אירוס טללה','מאור אלוני','דפנה פיינגולד','בת חן גיגי','יואב אסרף']};
const $=id=>document.getElementById(id),DAY=86400000;
function date(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function key(d){return d.toISOString().slice(0,10)}
function add(d,n){return new Date(d.getTime()+n*DAY)}
function israelToday(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${v.year}-${v.month}-${v.day}`}
function fmt(d,options){return new Intl.DateTimeFormat('he-IL',{...options,timeZone:'UTC'}).format(d)}
function dutyIndex(d){if(!CONFIG.start||key(d)<CONFIG.start||d.getUTCDay()>4)return null;const start=date(CONFIG.start),n=Math.round((d-start)/DAY);let count=Math.floor(n/7)*5;for(let i=0;i<n%7;i++)if(add(start,i).getUTCDay()<5)count++;return count}
function responsible(d){const n=dutyIndex(d);return n===null?null:CONFIG.people[n%CONFIG.people.length]}
function nextDuty(d,include){let t=include?d:add(d,1);if(CONFIG.start&&key(t)<CONFIG.start)t=date(CONFIG.start);for(let i=0;i<8;i++,t=add(t,1))if(responsible(t))return t;return null}
function initials(name){return name.split(' ').slice(0,2).map(x=>x[0]).join('')}
let todayKey=israelToday(),today=date(todayKey),view=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1)),selected=todayKey;
function renderHero(){const name=responsible(today);$('heroDate').textContent=fmt(today,{weekday:'long',day:'numeric',month:'long'});$('heroLabel').textContent=name?'האחראי היום':'היום';$('heroName').textContent=name||(!CONFIG.start?'הסבב בהכנה':today.getUTCDay()>4?'סוף שבוע שקט':'מתחילים בקרוב');$('heroNote').textContent=name?'אחריות על תורנות הניקיון של החד״ס':!CONFIG.start?'תאריך ההתחלה וסדר הסבב ממתינים לאישור.':today.getUTCDay()>4?'אין תורנות בימי שישי ושבת.':'הסבב עוד לא התחיל.';$('avatar').textContent=name?initials(name):'✦';const n=nextDuty(today,false);$('next').replaceChildren();if(n){const a=document.createElement('span');a.className='arrow';a.textContent='←';const text=document.createElement('span');text.textContent=`הבאה בתור · ${fmt(n,{weekday:'long',day:'numeric',month:'numeric'})}`;const strong=document.createElement('strong');strong.textContent=responsible(n);$('next').append(a,text,strong)}else $('next').textContent='תורנות אחת ביום · חלוקה שווה לאורך הסבב'}
function renderSelected(){const d=date(selected),name=responsible(d);$('selected').replaceChildren();const icon=document.createElement('div');icon.className='mini';icon.textContent=name?initials(name):'·';const div=document.createElement('div');const small=document.createElement('small');small.textContent=fmt(d,{weekday:'long',day:'numeric',month:'long'});const strong=document.createElement('strong');strong.textContent=name||(!CONFIG.start?'ממתין לאישור הסבב':key(d)<CONFIG.start?'לפני תחילת הסבב':'אין תורנות');div.append(small,strong);$('selected').append(icon,div);if(selected===todayKey){const p=document.createElement('span');p.className='pill';p.textContent='היום';$('selected').append(p)}}
function renderMonth(){const y=view.getUTCFullYear(),m=view.getUTCMonth();$('monthTitle').textContent=fmt(view,{month:'long',year:'numeric'});const grid=$('calendar');grid.replaceChildren();const end=new Date(Date.UTC(y,m+1,0));let first=new Date(Date.UTC(y,m,1));while(first.getUTCDay()>4)first=add(first,1);for(let i=0;i<first.getUTCDay();i++){const blank=document.createElement('div');blank.className='blank';blank.setAttribute('aria-hidden','true');grid.append(blank)}for(let d=first;d<=end;d=add(d,1)){if(d.getUTCDay()>4)continue;const k=key(d),name=responsible(d),b=document.createElement('button');b.type='button';b.className='day'+(k<todayKey?' past':'')+(k===todayKey?' today':'')+(!name?' empty-duty':'');b.setAttribute('aria-pressed',String(k===selected));b.setAttribute('aria-label',`${fmt(d,{weekday:'long',day:'numeric',month:'long'})}: ${name||'אין שיבוץ'}`);if(k===todayKey)b.setAttribute('aria-current','date');const num=document.createElement('span');num.className='num';num.textContent=d.getUTCDate();const text=document.createElement('span');text.className='name';text.textContent=(name?(name.startsWith('בת חן')?'בת חן':name.split(' ')[0]):null)||(!CONFIG.start?'טרם נקבע':'לפני הסבב');b.append(num,text);b.onclick=()=>{selected=k;renderMonth()};grid.append(b)}renderSelected()}
function changeMonth(n){view=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()+n,1));let d=new Date(view);while(d.getUTCDay()>4)d=add(d,1);selected=key(d);renderMonth()}
$('prev').onclick=()=>changeMonth(-1);$('nextMonth').onclick=()=>changeMonth(1);$('current').onclick=()=>{view=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1));selected=todayKey;renderMonth()};$('peopleCount').textContent=`${CONFIG.people.length} משתתפים`;
for(const p of CONFIG.people){const li=document.createElement('li');li.textContent=p;$('people').append(li)}
$('rotationNote').textContent=CONFIG.start?`מתחילים ב־${fmt(date(CONFIG.start),{day:'numeric',month:'numeric',year:'numeric'})}. הסבב ממשיך לפי הסדר, בלי להתאפס בתחילת שבוע או חודש.`:'סדר הסבב ותאריך ההתחלה טרם אושרו.';
renderHero();renderMonth();
function refreshDate(){const now=israelToday();if(now!==todayKey){todayKey=now;today=date(now);selected=now;view=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1));renderHero();renderMonth()}}
setInterval(refreshDate,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDate()});window.addEventListener('pageshow',refreshDate);
</script>
</body></html>
